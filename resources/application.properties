# ===== Formuvia =====
# Every key below can be overridden by the file named in custom.properties.path,
# or by a JVM system property of the same name (-Dcors.url=https://...).

# Full path to a properties file outside the WAR whose values win over the ones here.
# Keep everything that differs per installation there - password, addresses, cookie settings -
# so a new WAR is deployed without editing anything. Empty = only this file is read.
custom.properties.path=

# --- Database --------------------------------------------------------------
# Name this installation reports to PostgreSQL; it is what stands in pg_stat_activity,
# so give the test and the production server names of their own.
application.name=Formuvia

# The database and its user have to exist before the first start; the tables are made
# by the application itself, out of the entity classes.
database.url=jdbc:postgresql://localhost:5432/formuvia
database.username=formuvia
# The real password does not belong in this file - write it into custom.properties.path
# or pass it as -Ddatabase.password=...
database.password=formuvia
# How many connections are held open. 20 carries a few dozen users.
database.num.connections=20
# Asked of a pooled connection to see whether it is still alive. Leave as it is
database.check.query=select 1
# Schema looked at beside the one of the connection when tables and triggers ar
database.additional.shema=public
# true runs the SQL scripts from resources/queries at every start; they are wri
# repeatable. Set it to false only if the database is maintained by hand.
execute.scripts=true

# --- Texts and language ----------------------------------------------------
# Folder of your own translations, outside the WAR: a text found there wins over the one
# shipped with the application, and what is missing is taken from the application.
# Both this and the prefix below have to be set, otherwise the folder is not re
# Example: /etc/formuvia/i18n
resource.bundle.path=
# Name of those files, without the language and the extension. With my_texts th
# my_texts_en_US.properties, my_texts_sr_Latn_RS.properties and my_texts_sr_RS.properties.
resource.bundle.file.prefix=
# Language a visitor is served before choosing one: en-US, sr-Latn-RS or sr-RS.
default.language=en-US

language.list=en-US, sr-RS, sr-Latn-RS

# --- Files -----------------------------------------------------------------
# Folder the uploaded files are written into, every version of them kept. ${use
# the home of the user the server runs as. It has to be writable, and it has to
# backup - the database does not hold the files themselves.
files.path=${user.home}/.formuvia-files

# --- Web and sign in -------------------------------------------------------
# Address the client is served from, the only one allowed to call the API (CORS
# A client that travels inside this same WAR needs nothing here.
cors.url=http://localhost:4200
# Header the caller's real address is read from when a reverse proxy stands in
# Empty = the address of the direct connection is taken.
forward.ip-adress.header=X-Real-IP
# Password the admin account is made with at the very first start. Change it af
# sign in; changing it here afterwards does nothing to an account that already exists.
admin.default.password=admin

# --- Cookie of the session -------------------------------------------------
cookie.access.token.name=access_token
# How long the token holds, and for how long it can be renewed without signing in again.
cookie.access.token.duration.minutes=10
cookie.refresh.token.duration.minutes=10080
# true = the cookie travels over HTTPS only. Leave it true everywhere but local
cookie.secure=true
# true = scripts in the page cannot read the cookie. Do not change.
cookie.http.only=true
# Strict while the client and the API are on the same site; None (with cookie.secure=true)
# only when they are served from different sites.
cookie.same.site=Strict
cookie.path=/

# --- Scheduler -------------------------------------------------------------
# true = the jobs kept in the database are scheduled when the application starts.
quartz.database.start=true
# Quartz expressions, seconds first: how often notices that a code list changed are picked up,
# how often the listening connection is checked, and when spent tokens are clea
database.listen.cron=*/2 * * * * ?
database.listen.connection.check.cron=0 */1 * * * ?
token.clear.cron=0 0 */1 * * ?

# --- Formats in the exported files -----------------------------------------
# Java patterns; they decide how dates and times are written into Excel and CSV
excel.date.format=dd.MM.yyyy
excel.time.format=HH:mm
excel.date-time.format=dd.MM.yyyy HH:mm
csv.date.format=dd.MM.yyyy
csv.time.format=HH:mm
csv.date-time.format=dd.MM.yyyy HH:mm

# --- Mail ------------------------------------------------------------------
# Subject of the mail that Test mail sends from a mail server.
test.mail.subject.text=Formuvia - mail working